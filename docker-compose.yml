services:
  tillwise:
    image: ghcr.io/xpsixx/tillwise:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      VISION_MODEL: ${VISION_MODEL:-}
      TEXT_MODEL: ${TEXT_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      BYOK_BASE_URL: ${BYOK_BASE_URL:-}
      BYOK_API_KEY: ${BYOK_API_KEY:-}
      BYOK_VISION_MODEL: ${BYOK_VISION_MODEL:-}
      BYOK_TEXT_MODEL: ${BYOK_TEXT_MODEL:-}
      DATABASE_URL: ${DATABASE_URL:-}
      PGLITE_DATA_DIR: /data/pglite
    volumes:
      - tillwise-data:/data
    restart: unless-stopped
    # Entrypoint starts as root, chowns /data, then runs the app as node.

volumes:
  tillwise-data:
